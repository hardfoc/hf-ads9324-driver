<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">ADS9324&lt;Spi, Host&gt;, inc/ads9324.hpp</text>
<text x="56" y="612.4" font-size="20" font-weight="700" fill="#3730A3">Transport contracts</text>
<text x="56" y="643" font-size="17" fill="#2B3442">SpiInterface: 24-bit register frames and conversion bursts, one CS window per call;</text>
<text x="56" y="667.7" font-size="17" fill="#2B3442">HostInterface: CONVST pulse, DRDY poll or timed wait, power-on and reset delays</text>
<text x="56" y="766.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your classes)</text>
<text x="56" y="795.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">transfer()  ConvstWrite()  DrdyRead()  HasDrdy()  DelayUs()  DelayMs()</text>
<text x="56" y="894.4" font-size="20" font-weight="700" fill="#17202C">ADS9324</text>
<text x="56" y="925" font-size="17" fill="#2B3442">SPI mode 0 up to 60 MHz (SDI, SDOUT, SCLK, CS)  /  CONVST, DRDY/ALARM</text>
